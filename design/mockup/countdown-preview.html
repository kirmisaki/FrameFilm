<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纪念日倒数 · 撕页卡版 预览</title>
<link rel="stylesheet" href="base.css">
<style>
  .phone .content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FFF6EE; padding: 16px 0 10px; }
  .canvas-box { width: 300px; height: 450px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); background: #fff; }
  canvas { width: 100%; height: 100%; display: block; }
  .form { display: flex; gap: 10px; align-items: center; width: 300px; }
  .form input {
    flex: 1; border: none; border-radius: 999px; padding: 12px 18px; font-size: 14px;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.10); outline: none;
  }
  .form input[type=date] { flex: 0 0 auto; width: 150px; }
  .actions { display: flex; gap: 12px; }
  .act {
    border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.12); cursor: pointer;
  }
  .act.primary { background: linear-gradient(135deg, #FF6B6B, #FF9F6B); color: #fff; }
  .schemes { display: flex; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
  .sw.active { border-color: #FF6B6B; transform: scale(1.15); }
  .tip { color: #9B93A4; font-size: 12px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="page-head">
    <a class="back" href="index.html">← 返回设计稿</a>
    <h1>纪念日倒数 · 撕页卡</h1>
    <p>浅色纸张底 + 白色撕页日历卡（装订孔/日期条/大数字/锯齿撕边）+ 纪念日名称 + 状态行 · 任意设计色，上屏经自适应抖动</p>
  </div>

  <div class="stage">
    <div class="screen-item">
      <div class="phone">
        <div class="statusbar" style="background:#FFF6EE;color:#3A3A44;">
          <span>9:41</span>
          <div class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><path d="M12 3.5a5 5 0 0 1 0 5" stroke="#3A3A44" stroke-width="1.4" fill="none"/></svg>
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><rect x="11" y="8" width="3" height="3" rx="1" fill="#3A3A44"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="7.5" width="20" height="4.5" rx="2" fill="#3A3A44"/><rect x="20" y="9" width="2.5" height="1.5" rx="1" fill="none" stroke="#3A3A44" stroke-width="1"/></svg>
          </div>
        </div>
        <div class="navbar" style="background:#FFF6EE;color:#3A3A44;">纪念日倒数</div>
        <div class="content">
          <div class="canvas-box"><canvas id="cd"></canvas></div>
          <div class="form">
            <input id="name" type="text" maxlength="8" value="在一起" />
            <input id="date" type="date" />
          </div>
          <div class="actions">
            <button class="act primary" onclick="refresh()">🎋 换一天</button>
            <button class="act" id="epdBtn" onclick="toggleEPD()">👁 EPD 效果</button>
            <button class="act" id="stratBtn" onclick="toggleStrategy()">🖌 层:v3</button>
          </div>
          <div class="schemes" id="schemes"></div>
          <div class="tip">改名称或日期即时重绘 · 日期在未来=倒计时，在过去=已纪念<br>「EPD 效果」= 现小程序抖动，「E6Pro 效果」= 全局新算法，「分层渲染」= 文字/纯色零抖动+渐变/图片半色调逐层合成，连点按钮循环切换</div>
        </div>
      </div>
    </div>
  </div>

<script src="epd-sim.js?v=2"></script>
<script src="e6pro.js?v=8"></script>
<script>
// ===== 与 miniprogram/utils/tpl-countdown.js 同步 =====
var SCHEMES = [
  { name: '蜜桃', bg1: '#fff6f1', bg2: '#ffe6da', accent: '#ff5f7f', text: '#3a2a2e', sub: '#3a2a2e', num: '#3a2a2e' },
  { name: '湖蓝', bg1: '#f1f8ff', bg2: '#dcecf9', accent: '#3d7bff', text: '#23364e', sub: '#23364e', num: '#23364e' },
  { name: '抹茶', bg1: '#f2faf4', bg2: '#ddf0e2', accent: '#1fb573', text: '#2a4636', sub: '#2a4636', num: '#2a4636' },
  { name: '赤金', bg1: '#fdf9f2', bg2: '#f5e9d8', accent: '#c44a1f', text: '#463a2c', sub: '#463a2c', num: '#463a2c' }
];

function pad(n) { return ('0' + n).slice(-2); }

function buildData(name, dateStr) {
  var parts = dateStr.split('-');
  var target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var diff = Math.round((target - today) / 86400000);
  var mode = diff >= 0 ? 'countdown' : 'passed';
  var nowStr = now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());
  return { name: name || '纪念日', dateStr: dateStr, days: Math.abs(diff), mode: mode, todayStr: nowStr };
}

// 圆角矩形路径（预览页内置）
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 撕页卡片路径：顶边圆角 + 两侧直线 + 底部锯齿撕边
function drawTornCard(ctx, x0, y0, w, h, r, teeth) {
  var tearH = h * 0.1;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x0 + w - r, y0);
  ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
  ctx.lineTo(x0 + w, y0 + h - tearH);
  for (var i = 0; i < teeth; i++) {
    var bx = x0 + w - (i + 0.5) * (w / teeth);
    ctx.lineTo(bx, y0 + h);
    ctx.lineTo(x0 + w - (i + 1) * (w / teeth), y0 + h - tearH);
  }
  ctx.lineTo(x0, y0 + h - tearH);
  ctx.lineTo(x0, y0 + r);
  ctx.quadraticCurveTo(x0, y0, x0 + r, y0);
  ctx.closePath();
}

function render(ctx, W, H, data, scheme) {
  var s = scheme; var margin = Math.round(W * 0.07);
  // 深色背景渐变
  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, s.bg1); bg.addColorStop(1, s.bg2);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';
  // 顶部：品牌（左）+ 今日（右）
  ctx.fillStyle = s.sub; ctx.font = Math.round(W * 0.033) + 'px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('FRAME FILM · 幸福倒数', margin, Math.round(H * 0.05));
  ctx.fillStyle = s.sub; ctx.textAlign = 'right';
  ctx.fillText(data.todayStr, W - margin, Math.round(H * 0.05));
  // 白色撕页卡片
  var cardW = Math.round(W * 0.74);
  var cardH = Math.round(H * 0.38);
  var x0 = Math.round((W - cardW) / 2);
  var y0 = Math.round(H * 0.16);
  var teeth = Math.max(6, Math.round(cardW / (W * 0.016)));
  drawTornCard(ctx, x0, y0, cardW, cardH, Math.round(W * 0.02), teeth);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = s.sub; ctx.lineWidth = 1.5; ctx.stroke();
  // 装订孔（浅灰小圆）
  ctx.fillStyle = s.sub;
  ctx.beginPath(); ctx.arc(x0 + cardW * 0.22, y0 + Math.round(W * 0.018), Math.round(W * 0.008), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x0 + cardW * 0.78, y0 + Math.round(W * 0.018), Math.round(W * 0.008), 0, Math.PI * 2); ctx.fill();
  // 日期条（卡片顶部 accent 色）
  var barH = Math.round(cardH * 0.2);
  roundRect(ctx, x0 + Math.round(W * 0.006), y0 + Math.round(W * 0.006), cardW - Math.round(W * 0.012), barH, Math.round(W * 0.014));
  ctx.fillStyle = s.accent; ctx.fill();
  var dateParts = data.dateStr.split('-');
  var prettyDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.round(W * 0.034) + 'px sans-serif';
  ctx.fillText(data.mode === 'countdown' ? '距离 ' + prettyDate : '始于 ' + prettyDate, W / 2, y0 + Math.round(W * 0.006) + barH / 2);
  // 大数字 + DAYS（白卡片上深色）
  var dayStr = String(data.days);
  var dayFont = dayStr.length >= 4
    ? Math.round(W * 0.16)
    : (dayStr.length >= 3 ? Math.round(W * 0.23) : Math.round(W * 0.3));
  ctx.fillStyle = s.num;
  ctx.font = 'bold ' + dayFont + 'px serif';
  ctx.fillText(dayStr, W / 2, y0 + cardH * 0.58);
  ctx.fillStyle = s.accent;
  ctx.font = 'bold ' + Math.round(W * 0.042) + 'px sans-serif';
  ctx.fillText('DAYS', W / 2, y0 + cardH * 0.78);
  // 纪念日名称（卡片下方）
  var name = data.name; if (name.length > 8) name = name.slice(0, 8);
  ctx.fillStyle = s.text;
  ctx.font = 'bold ' + Math.round(W * 0.082) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText(name, W / 2, Math.round(H * 0.66));
  // 状态行：倒计时中 / 已纪念
  ctx.fillStyle = s.accent;
  ctx.font = 'bold ' + Math.round(W * 0.034) + 'px sans-serif';
  ctx.fillText(data.mode === 'countdown' ? '倒计时中' : '已纪念', W / 2, Math.round(H * 0.74));
  // 底部提示
  ctx.fillStyle = s.sub;
  ctx.font = Math.round(W * 0.028) + 'px sans-serif';
  var hint = data.mode === 'countdown'
    ? (data.days > 0 ? '再坚持 ' + data.days + ' 天就到大日子' : '就是今天！大日子来啦')
    : '那些日子都值得被记住';
  ctx.fillText(hint, W / 2, Math.round(H * 0.87));
  // 底部装饰线
  ctx.strokeStyle = s.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - Math.round(W * 0.06), Math.round(H * 0.93));
  ctx.lineTo(W / 2 + Math.round(W * 0.06), Math.round(H * 0.93));
  ctx.stroke();
}

// ===== 页面交互 =====
var CW = 400, CH = 600;
var canvas = document.getElementById('cd');
var scale = 2;
canvas.width = CW * scale; canvas.height = CH * scale;
canvas.style.width = '300px'; canvas.style.height = '450px';
var ctx = canvas.getContext('2d');
ctx.scale(scale, scale);

var schemeIdx = 0;
var viewMode = 'design';
var nameEl = document.getElementById('name');
var dateEl = document.getElementById('date');
dateEl.value = (function () {
  var d = new Date(); d.setDate(d.getDate() + 100);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
})();

var swBox = document.getElementById('schemes');
SCHEMES.forEach(function (s, i) {
  var d = document.createElement('div');
  d.className = 'sw' + (i === 0 ? ' active' : '');
  d.style.background = s.accent;
  d.title = s.name;
  d.onclick = function () { schemeIdx = i; syncSw(); draw(); };
  swBox.appendChild(d);
});
function syncSw() {
  var els = swBox.children;
  for (var i = 0; i < els.length; i++) els[i].className = 'sw' + (i === schemeIdx ? ' active' : '');
}
function draw() {
  var dta = buildData(nameEl.value, dateEl.value);
  render(ctx, CW, CH, dta, SCHEMES[schemeIdx]);
  if (viewMode === 'epd') EPDSim.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'e6') E6Pro.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'layer') {
    var rec = E6Pro.makeRecorder(CW, CH);
    render(rec, CW, CH, dta, SCHEMES[schemeIdx]);
    rec.finish(canvas, E6Pro.DEFAULTS);
  }
}
function refresh() { draw(); }
function toggleEPD() {
  var order = ['design', 'epd', 'e6', 'layer'];
  viewMode = order[(order.indexOf(viewMode) + 1) % order.length];
  var b = document.getElementById('epdBtn');
  b.textContent = viewMode === 'design' ? '👁 EPD 效果' : (viewMode === 'epd' ? '✨ E6Pro 效果' : (viewMode === 'e6' ? '🧩 分层渲染' : '🎨 设计原色'));
  b.classList.toggle('primary', viewMode !== 'design');
  draw();
}
function toggleStrategy() {
  var cur = E6Pro.DEFAULTS.gradStrategy === 'adaptive' ? 'v3' : 'adaptive';
  E6Pro.DEFAULTS.gradStrategy = cur;
  E6Pro.DEFAULTS.imgStrategy = cur;
  document.getElementById('stratBtn').textContent = '🖌 层:' + (cur === 'adaptive' ? '自适应' : 'v3');
  if (viewMode === 'layer') draw();
}
nameEl.addEventListener('input', draw);
dateEl.addEventListener('change', draw);
draw();
</script>
</body>
</html>
