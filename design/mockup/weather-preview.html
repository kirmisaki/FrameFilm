<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气 · 深色氛围卡 预览</title>
<link rel="stylesheet" href="base.css">
<style>
  .phone .content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FFF6EE; padding: 16px 0 10px; }
  .canvas-box { width: 300px; height: 450px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); background: #fff; }
  canvas { width: 100%; height: 100%; display: block; }
  .actions { display: flex; gap: 12px; }
  .act {
    border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.12); cursor: pointer;
  }
  .act.primary { background: linear-gradient(135deg, #4D96FF, #2F6FD8); color: #fff; }
  .schemes { display: flex; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
  .sw.active { border-color: #FF6B6B; transform: scale(1.15); }
  .tip { color: #9B93A4; font-size: 12px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="page-head">
    <a class="back" href="index.html">← 返回设计稿</a>
    <h1>天气 · 氛围卡</h1>
    <p>浅色渐变底 + 大天气图标/大温度主视觉 + 未来 3 天白色卡片 · 演示数据（小程序内走 Open-Meteo 实时接口）· 任意设计色，上屏经自适应抖动</p>
  </div>

  <div class="stage">
    <div class="screen-item">
      <div class="phone">
        <div class="statusbar" style="background:#FFF6EE;color:#3A3A44;">
          <span>9:41</span>
          <div class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><path d="M12 3.5a5 5 0 0 1 0 5" stroke="#3A3A44" stroke-width="1.4" fill="none"/></svg>
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><rect x="11" y="8" width="3" height="3" rx="1" fill="#3A3A44"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="7.5" width="20" height="4.5" rx="2" fill="#3A3A44"/><rect x="20" y="9" width="2.5" height="1.5" rx="1" fill="none" stroke="#3A3A44" stroke-width="1"/></svg>
          </div>
        </div>
        <div class="navbar" style="background:#FFF6EE;color:#3A3A44;">天气</div>
        <div class="content">
          <div class="canvas-box"><canvas id="wx"></canvas></div>
          <div class="actions">
            <button class="act primary" onclick="randomIcon()">🎲 换个天气</button>
            <button class="act" id="epdBtn" onclick="toggleEPD()">👁 EPD 效果</button>
            <button class="act" id="stratBtn" onclick="toggleStrategy()">🖌 层:v3</button>
          </div>
          <div class="schemes" id="schemes"></div>
          <div class="tip">点「换个天气」随机天气场景 · 点色块换主题色<br>「EPD 效果」= 现小程序抖动，「E6Pro 效果」= 全局新算法，「分层渲染」= 文字/纯色零抖动+渐变/图片半色调逐层合成，连点按钮循环切换</div>
        </div>
      </div>
    </div>
  </div>

<script src="epd-sim.js?v=2"></script>
<script src="e6pro.js?v=8"></script>
<script>
// ===== 与 miniprogram/utils/tpl-weather.js 同步 =====
function codeToCond(code) {
  if (code === 0) return '晴';
  if (code === 1 || code === 2) return '多云';
  if (code === 3) return '阴';
  if (code >= 45 && code <= 48) return '雾';
  if (code >= 51 && code <= 67) return '雨';
  if (code >= 71 && code <= 77) return '雪';
  if (code >= 80 && code <= 82) return '阵雨';
  if (code >= 95) return '雷雨';
  return '多云';
}
function codeToIcon(code) {
  if (code === 0) return 0;
  if (code === 1 || code === 2) return 1;
  if (code === 3) return 2;
  if (code >= 45 && code <= 48) return 2;
  if (code >= 51 && code <= 67) return 3;
  if (code >= 80 && code <= 82) return 4;
  if (code >= 95) return 4;
  if (code >= 71 && code <= 77) return 5;
  return 1;
}
var ICON_CONDS = [
  { icon: 0, cond: '晴', temp: 31, hi: 34, lo: 24 },
  { icon: 1, cond: '多云', temp: 28, hi: 32, lo: 21 },
  { icon: 2, cond: '阴', temp: 24, hi: 26, lo: 19 },
  { icon: 3, cond: '雨', temp: 22, hi: 24, lo: 20 },
  { icon: 4, cond: '雷雨', temp: 25, hi: 27, lo: 21 },
  { icon: 5, cond: '雪', temp: -2, hi: 1, lo: -6 }
];
function getDemoData() {
  var now = new Date();
  var weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return {
    city: '深圳', cond: '多云', icon: 1, temp: 28, hi: 32, lo: 21, updated: '演示数据',
    days: [
      { name: weekNames[(now.getDay() + 1) % 7], icon: 0, hi: 32, lo: 22 },
      { name: weekNames[(now.getDay() + 2) % 7], icon: 3, hi: 29, lo: 21 },
      { name: weekNames[(now.getDay() + 3) % 7], icon: 1, hi: 30, lo: 20 }
    ]
  };
}

var SCHEMES = [
  { name: '晴蓝', bg1: '#f2f9ff', bg2: '#dceefb', accent: '#2f6fd8', text: '#1f3a5a', sub: '#2c4a6a', sub2: '#3a5a78', card: '#ffffff' },
  { name: '霞橙', bg1: '#fff6ef', bg2: '#ffe7d6', accent: '#e8762c', text: '#4a3020', sub: '#4a3324', sub2: '#5a3f2c', card: '#ffffff' },
  { name: '浅翠', bg1: '#f2faf4', bg2: '#ddf0e4', accent: '#1fa86c', text: '#23402f', sub: '#26443a', sub2: '#3a5848', card: '#ffffff' },
  { name: '靛蓝', bg1: '#f4f5fc', bg2: '#e2e4f2', accent: '#4450b8', text: '#2e3350', sub: '#2e3350', sub2: '#454a66', card: '#ffffff' }
];

// 圆角矩形路径（预览页内置）
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ===== 几何天气图标（深色主题，跟随配色） =====
function drawCloud(ctx, cx, cy, r, s) {
  ctx.beginPath();
  ctx.arc(cx - r * 0.38, cy, r * 0.34, 0, Math.PI * 2);
  ctx.arc(cx, cy - r * 0.22, r * 0.42, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.4, cy, r * 0.32, 0, Math.PI * 2);
  ctx.arc(cx, cy + r * 0.08, r * 0.52, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = s.sub2; ctx.lineWidth = Math.max(1.5, r * 0.08); ctx.stroke();
}
function drawSun(ctx, cx, cy, r, s) {
  ctx.lineWidth = Math.max(2, r * 0.11);
  ctx.strokeStyle = s.accent; ctx.fillStyle = s.accent; ctx.lineCap = 'round';
  for (var i = 0; i < 8; i++) {
    var a = Math.PI / 4 * i;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8);
    ctx.lineTo(cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * 1.12);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fill();
}
function drawIcon(ctx, cx, cy, r, type, s) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (type === 0) {
    drawSun(ctx, cx, cy, r, s);
  } else if (type === 1) {
    drawSun(ctx, cx - r * 0.4, cy - r * 0.28, r * 0.5, s);
    drawCloud(ctx, cx + r * 0.12, cy + r * 0.22, r * 0.72, s);
  } else if (type === 2) {
    drawCloud(ctx, cx, cy, r * 0.9, s);
  } else if (type === 3) {
    drawCloud(ctx, cx, cy - r * 0.12, r * 0.72, s);
    ctx.strokeStyle = s.accent; ctx.lineWidth = Math.max(2, r * 0.1);
    for (var j = -1; j <= 1; j++) {
      ctx.beginPath();
      ctx.moveTo(cx + j * r * 0.32, cy + r * 0.42);
      ctx.lineTo(cx + j * r * 0.38, cy + r * 0.78);
      ctx.stroke();
    }
  } else if (type === 4) {
    drawCloud(ctx, cx, cy - r * 0.12, r * 0.72, s);
    ctx.fillStyle = s.accent;
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.12, cy + r * 0.3);
    ctx.lineTo(cx - r * 0.18, cy + r * 0.62);
    ctx.lineTo(cx + r * 0.02, cy + r * 0.62);
    ctx.lineTo(cx - r * 0.12, cy + r * 0.95);
    ctx.lineTo(cx + r * 0.22, cy + r * 0.55);
    ctx.lineTo(cx + r * 0.02, cy + r * 0.55);
    ctx.closePath(); ctx.fill();
  } else {
    drawCloud(ctx, cx, cy - r * 0.12, r * 0.72, s);
    ctx.fillStyle = s.accent;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.arc(cx + k * r * 0.32, cy + r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ===== 渲染 =====
function render(ctx, W, H, data, scheme) {
  var s = scheme; var margin = Math.round(W * 0.07);
  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, s.bg1); bg.addColorStop(1, s.bg2);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';
  // 顶部：城市（左）+ 更新时间胶囊（右）
  ctx.fillStyle = s.text; ctx.font = 'bold ' + Math.round(W * 0.052) + 'px serif'; ctx.textAlign = 'left';
  ctx.fillText(data.city, margin, Math.round(H * 0.06));
  var tagW = Math.round(W * 0.13), tagH = Math.round(W * 0.052);
  roundRect(ctx, W - margin - tagW, Math.round(H * 0.06) - tagH / 2, tagW, tagH, tagH / 2);
  ctx.fillStyle = s.accent; ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold ' + Math.round(W * 0.026) + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(data.updated, W - margin - tagW / 2, Math.round(H * 0.06));
  // 主视觉：大图标 + 大温度
  var iconR = Math.round(W * 0.16);
  drawIcon(ctx, Math.round(W * 0.3), Math.round(H * 0.3), iconR, data.icon, s);
  ctx.fillStyle = s.text; ctx.font = 'bold ' + Math.round(W * 0.19) + 'px serif'; ctx.textAlign = 'left';
  ctx.fillText(data.temp + '°', Math.round(W * 0.47), Math.round(H * 0.3));
  ctx.fillStyle = s.accent; ctx.font = 'bold ' + Math.round(W * 0.058) + 'px serif';
  ctx.fillText(data.cond, Math.round(W * 0.48), Math.round(H * 0.42));
  // 副行：温度范围
  ctx.fillStyle = s.sub; ctx.font = Math.round(W * 0.04) + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('最高 ' + data.hi + '°   最低 ' + data.lo + '°', W / 2, Math.round(H * 0.5));
  // 分隔线
  ctx.strokeStyle = s.accent; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(margin, Math.round(H * 0.545)); ctx.lineTo(W - margin, Math.round(H * 0.545)); ctx.stroke();
  // 未来 3 天卡片
  var cardW = (W - margin * 2 - Math.round(W * 0.04) * 2) / 3;
  var cardH = Math.round(H * 0.3);
  var cardTop = Math.round(H * 0.58);
  for (var i = 0; i < data.days.length; i++) {
    var day = data.days[i];
    var x = margin + i * (cardW + Math.round(W * 0.04));
    roundRect(ctx, x, cardTop, cardW, cardH, Math.round(W * 0.02));
    ctx.fillStyle = s.card; ctx.fill();
    ctx.strokeStyle = s.accent; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = s.sub; ctx.font = 'bold ' + Math.round(W * 0.038) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(day.name, x + cardW / 2, cardTop + cardH * 0.14);
    drawIcon(ctx, Math.round(x + cardW / 2), Math.round(cardTop + cardH * 0.46), Math.round(cardW * 0.18), day.icon, s);
    ctx.font = 'bold ' + Math.round(W * 0.042) + 'px sans-serif'; ctx.fillStyle = s.accent;
    ctx.fillText(day.hi + '°', Math.round(x + cardW / 2 - cardW * 0.16), cardTop + cardH * 0.8);
    ctx.font = Math.round(W * 0.038) + 'px sans-serif'; ctx.fillStyle = s.sub2;
    ctx.fillText(day.lo + '°', Math.round(x + cardW / 2 + cardW * 0.14), cardTop + cardH * 0.8);
  }
  // 底部小标
  ctx.font = Math.round(W * 0.03) + 'px sans-serif'; ctx.fillStyle = s.accent; ctx.textAlign = 'center';
  ctx.fillText('FRAME FILM · WEATHER', W / 2, Math.round(H * 0.93));
}

// ===== 页面交互 =====
var CW = 400, CH = 600;
var canvas = document.getElementById('wx');
var scale = 2;
canvas.width = CW * scale; canvas.height = CH * scale;
canvas.style.width = '300px'; canvas.style.height = '450px';
var ctx = canvas.getContext('2d');
ctx.scale(scale, scale);

var schemeIdx = 0;
var iconIdx = 1;
var viewMode = 'design';
var data = getDemoData();

function refreshData() {
  var c = ICON_CONDS[iconIdx];
  var now = new Date();
  var weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  data.cond = c.cond; data.icon = c.icon; data.temp = c.temp; data.hi = c.hi; data.lo = c.lo;
  data.days = [
    { name: weekNames[(now.getDay() + 1) % 7], icon: (iconIdx + 1) % 6, hi: c.hi, lo: c.lo - 4 },
    { name: weekNames[(now.getDay() + 2) % 7], icon: (iconIdx + 3) % 6, hi: c.hi - 2, lo: c.lo - 5 },
    { name: weekNames[(now.getDay() + 3) % 7], icon: (iconIdx + 2) % 6, hi: c.hi - 1, lo: c.lo - 3 }
  ];
}

var swBox = document.getElementById('schemes');
SCHEMES.forEach(function (s, i) {
  var d = document.createElement('div');
  d.className = 'sw' + (i === 0 ? ' active' : '');
  d.style.background = s.accent;
  d.title = s.name;
  d.onclick = function () { schemeIdx = i; syncSw(); draw(); };
  swBox.appendChild(d);
});
function syncSw() {
  var els = swBox.children;
  for (var i = 0; i < els.length; i++) els[i].className = 'sw' + (i === schemeIdx ? ' active' : '');
}
function draw() {
  var dta = data;
  render(ctx, CW, CH, dta, SCHEMES[schemeIdx]);
  if (viewMode === 'epd') EPDSim.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'e6') E6Pro.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'layer') {
    var rec = E6Pro.makeRecorder(CW, CH);
    render(rec, CW, CH, dta, SCHEMES[schemeIdx]);
    rec.finish(canvas, E6Pro.DEFAULTS);
  }
}
function randomIcon() { iconIdx = Math.floor(Math.random() * ICON_CONDS.length); refreshData(); draw(); }
function toggleEPD() {
  var order = ['design', 'epd', 'e6', 'layer'];
  viewMode = order[(order.indexOf(viewMode) + 1) % order.length];
  var b = document.getElementById('epdBtn');
  b.textContent = viewMode === 'design' ? '👁 EPD 效果' : (viewMode === 'epd' ? '✨ E6Pro 效果' : (viewMode === 'e6' ? '🧩 分层渲染' : '🎨 设计原色'));
  b.classList.toggle('primary', viewMode !== 'design');
  draw();
}
function toggleStrategy() {
  var cur = E6Pro.DEFAULTS.gradStrategy === 'adaptive' ? 'v3' : 'adaptive';
  E6Pro.DEFAULTS.gradStrategy = cur;
  E6Pro.DEFAULTS.imgStrategy = cur;
  document.getElementById('stratBtn').textContent = '🖌 层:' + (cur === 'adaptive' ? '自适应' : 'v3');
  if (viewMode === 'layer') draw();
}
draw();
</script>
</body>
</html>
