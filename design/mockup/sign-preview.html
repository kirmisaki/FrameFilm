<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一签 · 书法大字签 预览</title>
<link rel="stylesheet" href="base.css">
<style>
  .phone .content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFF6EE; padding: 16px 0 10px; }
  .canvas-box { width: 300px; height: 450px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); background: #fff; }
  canvas { width: 100%; height: 100%; display: block; }
  .actions { display: flex; gap: 12px; }
  .act {
    border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.12); cursor: pointer;
  }
  .act.primary { background: linear-gradient(135deg, #FF6B6B, #FF9F6B); color: #fff; }
  .schemes { display: flex; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
  .sw.active { border-color: #FF6B6B; transform: scale(1.15); }
  .tip { color: #9B93A4; font-size: 12px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="page-head">
    <a class="back" href="index.html">← 返回设计稿</a>
    <h1>每日一签 · 书法大字签</h1>
    <p>浅色纸张底 · 四角角标 · 等级印章 · 中央书法大字（吉/平/藏）· 幽默签语 · 幸运信息</p>
  </div>

  <div class="stage">
    <div class="screen-item">
      <div class="phone">
        <div class="statusbar" style="background:#FFF6EE;color:#3A3A44;">
          <span>9:41</span>
          <div class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><path d="M12 3.5a5 5 0 0 1 0 5" stroke="#3A3A44" stroke-width="1.4" fill="none"/></svg>
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><rect x="11" y="8" width="3" height="3" rx="1" fill="#3A3A44"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="7.5" width="20" height="4.5" rx="2" fill="#3A3A44"/><rect x="20" y="9" width="2.5" height="1.5" rx="1" fill="none" stroke="#3A3A44" stroke-width="1"/></svg>
          </div>
        </div>
        <div class="navbar" style="background:#FFF6EE;color:#3A3A44;">每日一签</div>
        <div class="content">
          <div class="canvas-box"><canvas id="sign"></canvas></div>
          <div class="actions">
            <button class="act primary" onclick="refresh()">🎋 换一签</button>
            <button class="act" id="epdBtn" onclick="toggleEPD()">👁 EPD 效果</button>
            <button class="act" id="stratBtn" onclick="toggleStrategy()">🖌 层:v3</button>
          </div>
          <div class="schemes" id="schemes"></div>
          <div class="tip">点击「换一签」随机抽签 · 点色块换主题色<br>「EPD 效果」= 现小程序抖动，「E6Pro 效果」= 全局新算法，「分层渲染」= 文字/纯色零抖动+渐变/图片半色调逐层合成，连点按钮循环切换</div>
        </div>
      </div>
    </div>
  </div>

<script src="epd-sim.js?v=2"></script>
<script src="e6pro.js?v=8"></script>
<script>
// ===== 与 miniprogram/utils/tpl-sign.js 同步 =====
var SIGN_BOOK = [
  { grade: '大吉', yi: '大笑', ji: '皱眉', quotes: [
    '今天的心情开了倍速，好运直接冲到你面前',
    '想见的人今天能见到，想吃的今天队伍也短',
    '钱包今日发福，适合犒劳自己一顿',
    '好运开关已打开，出门请微笑'] },
  { grade: '吉', yi: '出发', ji: '犹豫', quotes: [
    '饭要好好吃，觉要好好睡，其余都是小事',
    '该出手时就出手，别等机会溜走再拍大腿',
    '今天适合做一件一直没敢做的事',
    '小步快跑，今天先完成一个小目标'] },
  { grade: '平', yi: '放空', ji: '较真', quotes: [
    '平平淡淡才是真，今天适合躺着充电',
    '小计划慢慢推，别急着一步登天',
    '今天宜发呆，不宜纠结别人一句话',
    '稳住别浪，今天的重点是别累到自己'] },
  { grade: '低调', yi: '低调', ji: '立flag', quotes: [
    '今天不宜立 flag，说啥啥不准',
    '大事别今天办，先喝口水冷静一下',
    '出门带把伞，虽然不一定下雨，但带着安心',
    '今天适合苟住，出风头的事改天再干'] }
];
var LUCKY_COLOR_HEX = { '红': '#ff0000', '蓝': '#0000ff', '绿': '#29cc14', '黄': '#ffd400' };
var LUCKY_COLOR_NAMES = ['红', '蓝', '绿', '黄'];

var SCHEMES = [
  { name: '朱砂', bg1: '#fff7f3', bg2: '#ffe7dc', accent: '#e8553d', text: '#4a2f2a', sub: '#3a2f2a' },
  { name: '天青', bg1: '#f1f8ff', bg2: '#dcebf8', accent: '#2f6fd8', text: '#26384e', sub: '#2a3a52' },
  { name: '竹绿', bg1: '#f2faf4', bg2: '#ddf0e2', accent: '#1fa86c', text: '#2a4636', sub: '#2e4438' },
  { name: '赤金', bg1: '#fdf9f0', bg2: '#f6ecd8', accent: '#c44a1f', text: '#4a3d28', sub: '#4a3f2c' }
];

function pad(n) { return ('0' + n).slice(-2); }
function wrapText(ctx, text, fontSize, maxWidth) {
  var lines = []; var cur = '';
  for (var i = 0; i < text.length; i++) {
    cur += text[i];
    if (ctx.measureText(cur).width > maxWidth) { lines.push(cur.slice(0, -1)); cur = text[i]; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function getRandomSign() {
  var level = Math.floor(Math.random() * SIGN_BOOK.length);
  var group = SIGN_BOOK[level];
  var quote = group.quotes[Math.floor(Math.random() * group.quotes.length)];
  var luckyName = LUCKY_COLOR_NAMES[Math.floor(Math.random() * LUCKY_COLOR_NAMES.length)];
  return {
    grade: group.grade, yi: group.yi, ji: group.ji, text: quote,
    signNum: Math.floor(Math.random() * 99) + 1,
    luckyColor: luckyName, luckyHex: LUCKY_COLOR_HEX[luckyName],
    luckyNum: Math.floor(Math.random() * 10)
  };
}

// 等级 -> 视觉大字（书法单字）
function gradeChar(grade) {
  if (grade === '大吉' || grade === '吉') return '吉';
  if (grade === '平') return '平';
  return '藏'; // 低调
}

// 四角角标装饰
function drawCorner(ctx, x, y, dirX, dirY, len) {
  ctx.beginPath();
  ctx.moveTo(x + dirX * len, y);
  ctx.lineTo(x, y);
  ctx.lineTo(x, y + dirY * len);
  ctx.stroke();
}

function render(ctx, W, H, data, scheme) {
  var s = scheme; var margin = Math.round(W * 0.08);
  // 深色背景渐变
  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, s.bg1); bg.addColorStop(1, s.bg2);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';
  // 四角角标
  ctx.strokeStyle = s.sub; ctx.lineWidth = 2;
  var cl = Math.round(W * 0.05);
  drawCorner(ctx, margin, Math.round(H * 0.045), 1, 1, cl);
  drawCorner(ctx, W - margin, Math.round(H * 0.045), -1, 1, cl);
  drawCorner(ctx, margin, Math.round(H * 0.955), 1, -1, cl);
  drawCorner(ctx, W - margin, Math.round(H * 0.955), -1, -1, cl);
  // 顶部：品牌（左）+ 日期（右）
  ctx.fillStyle = s.sub; ctx.font = Math.round(W * 0.028) + 'px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('FRAME FILM · 今日一签', margin, Math.round(H * 0.055));
  var now = new Date();
  var dateStr = now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());
  ctx.fillStyle = s.sub; ctx.textAlign = 'right';
  ctx.fillText(dateStr, W - margin, Math.round(H * 0.055));
  // 等级印章（accent 圆角方块，内白字等级全称）
  var sealW = Math.round(W * 0.2);
  var sealH = Math.round(W * 0.085);
  var sealX = W / 2 - sealW / 2;
  var sealY = Math.round(H * 0.17);
  ctx.beginPath();
  ctx.moveTo(sealX + sealH / 2, sealY);
  ctx.lineTo(sealX + sealW - sealH / 2, sealY);
  ctx.quadraticCurveTo(sealX + sealW, sealY, sealX + sealW, sealY + sealH / 2);
  ctx.quadraticCurveTo(sealX + sealW, sealY + sealH, sealX + sealW - sealH / 2, sealY + sealH);
  ctx.lineTo(sealX + sealH / 2, sealY + sealH);
  ctx.quadraticCurveTo(sealX, sealY + sealH, sealX, sealY + sealH / 2);
  ctx.quadraticCurveTo(sealX, sealY, sealX + sealH / 2, sealY);
  ctx.closePath();
  ctx.fillStyle = s.accent; ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.round(W * 0.042) + 'px serif';
  ctx.fillText('第 ' + data.signNum + ' 签 · ' + data.grade, W / 2, sealY + sealH / 2);
  // 中央书法大字
  var bigChar = gradeChar(data.grade);
  var bigFont = Math.round(W * 0.42);
  ctx.fillStyle = s.text;
  ctx.font = 'bold ' + bigFont + 'px serif';
  ctx.fillText(bigChar, W / 2, Math.round(H * 0.4));
  // 签文（居中 1-2 行）
  var fontSize = Math.round(W * 0.052);
  ctx.font = 'bold ' + fontSize + 'px serif';
  var lines = wrapText(ctx, data.text, fontSize, W - margin * 2);
  var lineHeight = Math.round(fontSize * 1.6);
  var textStartY = Math.round(H * 0.6);
  ctx.fillStyle = s.text;
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, textStartY + i * lineHeight);
  // 底部幸运信息
  var luckyY = Math.round(H * 0.8);
  ctx.fillStyle = s.accent; ctx.font = 'bold ' + Math.round(W * 0.034) + 'px sans-serif';
  ctx.fillText('宜 ' + data.yi, W / 2 - Math.round(W * 0.32), luckyY);
  ctx.fillStyle = s.text; ctx.font = Math.round(W * 0.034) + 'px sans-serif';
  ctx.fillText('忌 ' + data.ji, W / 2 - Math.round(W * 0.11), luckyY);
  ctx.beginPath(); ctx.arc(W / 2 + Math.round(W * 0.09), luckyY, Math.round(W * 0.02), 0, Math.PI * 2);
  ctx.fillStyle = data.luckyHex; ctx.fill();
  ctx.strokeStyle = s.text; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = s.text;
  ctx.fillText('幸运数字 ' + data.luckyNum, W / 2 + Math.round(W * 0.2), luckyY);
  // 底部装饰线
  ctx.strokeStyle = s.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - Math.round(W * 0.06), Math.round(H * 0.92));
  ctx.lineTo(W / 2 + Math.round(W * 0.06), Math.round(H * 0.92));
  ctx.stroke();
}

// ===== 页面交互 =====
var CW = 400, CH = 600;
var canvas = document.getElementById('sign');
var scale = 2;
canvas.width = CW * scale; canvas.height = CH * scale;
canvas.style.width = '300px'; canvas.style.height = '450px';
var ctx = canvas.getContext('2d');
ctx.scale(scale, scale);

var sign = getRandomSign();
var schemeIdx = 0;
var viewMode = 'design';

var swBox = document.getElementById('schemes');
SCHEMES.forEach(function (s, i) {
  var d = document.createElement('div');
  d.className = 'sw' + (i === 0 ? ' active' : '');
  d.style.background = s.accent;
  d.title = s.name;
  d.onclick = function () { schemeIdx = i; syncSw(); draw(); };
  swBox.appendChild(d);
});
function syncSw() {
  var els = swBox.children;
  for (var i = 0; i < els.length; i++) els[i].className = 'sw' + (i === schemeIdx ? ' active' : '');
}
function draw() {
  var dta = sign;
  render(ctx, CW, CH, dta, SCHEMES[schemeIdx]);
  if (viewMode === 'epd') EPDSim.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'e6') E6Pro.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'layer') {
    var rec = E6Pro.makeRecorder(CW, CH);
    render(rec, CW, CH, dta, SCHEMES[schemeIdx]);
    rec.finish(canvas, E6Pro.DEFAULTS);
  }
}
function refresh() { sign = getRandomSign(); draw(); }
function toggleEPD() {
  var order = ['design', 'epd', 'e6', 'layer'];
  viewMode = order[(order.indexOf(viewMode) + 1) % order.length];
  var b = document.getElementById('epdBtn');
  b.textContent = viewMode === 'design' ? '👁 EPD 效果' : (viewMode === 'epd' ? '✨ E6Pro 效果' : (viewMode === 'e6' ? '🧩 分层渲染' : '🎨 设计原色'));
  b.classList.toggle('primary', viewMode !== 'design');
  draw();
}
function toggleStrategy() {
  var cur = E6Pro.DEFAULTS.gradStrategy === 'adaptive' ? 'v3' : 'adaptive';
  E6Pro.DEFAULTS.gradStrategy = cur;
  E6Pro.DEFAULTS.imgStrategy = cur;
  document.getElementById('stratBtn').textContent = '🖌 层:' + (cur === 'adaptive' ? '自适应' : 'v3');
  if (viewMode === 'layer') draw();
}
draw();
</script>
</body>
</html>
