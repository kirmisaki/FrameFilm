<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备忘录 · 纸张便签版 预览</title>
<link rel="stylesheet" href="base.css">
<style>
  .phone .content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FFF6EE; padding: 16px 0 10px; }
  .canvas-box { width: 300px; height: 450px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); background: #fff; }
  canvas { width: 100%; height: 100%; display: block; }
  .form { display: flex; gap: 10px; align-items: center; width: 300px; }
  .form input {
    flex: 1; border: none; border-radius: 999px; padding: 12px 18px; font-size: 14px;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.10); outline: none;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .act {
    border: none; border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 700;
    background: #fff; color: #3A3A44; box-shadow: 0 4px 14px rgba(0,0,0,.12); cursor: pointer;
  }
  .act.primary { background: linear-gradient(135deg, #FF6B6B, #FF9F6B); color: #fff; }
  .schemes { display: flex; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
  .sw.active { border-color: #FF6B6B; transform: scale(1.15); }
  .tip { color: #9B93A4; font-size: 12px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="page-head">
    <a class="back" href="index.html">← 返回设计稿</a>
    <h1>备忘录 · 纸张便签</h1>
    <p>纯白纸张底 + 白卡片（sub2 描边）+ 深墨条目文字 + accent 勾选框（完成=实心+白勾+删除线）· 可手动增删/勾选条目，上屏经分层渲染</p>
  </div>

  <div class="stage">
    <div class="screen-item">
      <div class="phone">
        <div class="statusbar" style="background:#FFF6EE;color:#3A3A44;">
          <span>9:41</span>
          <div class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><path d="M12 3.5a5 5 0 0 1 0 5" stroke="#3A3A44" stroke-width="1.4" fill="none"/></svg>
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="10" height="5" rx="1" fill="#3A3A44"/><rect x="11" y="8" width="3" height="3" rx="1" fill="#3A3A44"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="7.5" width="20" height="4.5" rx="2" fill="#3A3A44"/><rect x="20" y="9" width="2.5" height="1.5" rx="1" fill="none" stroke="#3A3A44" stroke-width="1"/></svg>
          </div>
        </div>
        <div class="navbar" style="background:#FFF6EE;color:#3A3A44;">备忘录</div>
        <div class="content">
          <div class="canvas-box"><canvas id="memo"></canvas></div>
          <div class="form">
            <input id="text" type="text" maxlength="14" placeholder="输入备忘内容…" />
            <button class="act primary" onclick="addItem()">＋ 添加</button>
          </div>
          <div class="actions">
            <button class="act" onclick="loadDemo()">📋 示例</button>
            <button class="act" onclick="clearAll()">🗑 清空</button>
            <button class="act" id="epdBtn" onclick="toggleEPD()">👁 EPD 效果</button>
            <button class="act" id="stratBtn" onclick="toggleStrategy()">🖌 层:v3</button>
          </div>
          <div class="schemes" id="schemes"></div>
          <div class="tip">输入内容点「添加」入列（最多 8 条）· 点画布中的条目切换完成/未完成<br>「EPD 效果」= 现小程序抖动，「E6Pro 效果」= 全局新算法，「分层渲染」= 文字/纯色零抖动+渐变/图片半色调逐层合成，连点按钮循环切换</div>
        </div>
      </div>
    </div>
  </div>

<script src="epd-sim.js?v=2"></script>
<script src="e6pro.js?v=8"></script>
<script>
// ===== 与 miniprogram/utils/tpl-memo.js 同步 =====
var SCHEMES = [
  { name: '朱砂', accent: '#e8553d', text: '#3a3631', sub: '#4a443c', sub2: '#5a5448' },
  { name: '晴蓝', accent: '#2f6fd8', text: '#2c3a4d', sub: '#33455c', sub2: '#47586e' },
  { name: '竹绿', accent: '#1fa86c', text: '#2c4438', sub: '#33503f', sub2: '#46604f' },
  { name: '蜜桃', accent: '#e8557a', text: '#453a38', sub: '#4a3c3a', sub2: '#5e4a46' },
  { name: '赤金', accent: '#c44a1f', text: '#453b28', sub: '#4a402c', sub2: '#5c503a' }
];
var MAX_ITEMS = 8;

function pad(n) { return ('0' + n).slice(-2); }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
}

// 圆角矩形路径（预览页内置）
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function buildData(items) {
  var doneCount = 0;
  items.forEach(function (it) { if (it.done) doneCount++; });
  return { items: items, todayStr: todayStr(), doneCount: doneCount };
}

function render(ctx, W, H, data, scheme) {
  var s = scheme; var margin = Math.round(W * 0.07);
  // 纯白背景
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';
  // 顶部品牌行
  ctx.fillStyle = s.sub; ctx.font = Math.round(W * 0.033) + 'px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('FRAME FILM · 备忘录', margin, Math.round(H * 0.05));
  ctx.textAlign = 'right';
  ctx.fillText(data.todayStr, W - margin, Math.round(H * 0.05));
  // 大标题 + accent 下划线
  ctx.fillStyle = s.text; ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.round(W * 0.075) + 'px serif';
  ctx.fillText('今日备忘', W / 2, Math.round(H * 0.15));
  ctx.strokeStyle = s.accent; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2 - Math.round(W * 0.04), Math.round(H * 0.21));
  ctx.lineTo(W / 2 + Math.round(W * 0.04), Math.round(H * 0.21));
  ctx.stroke();
  // 条目卡片
  var items = data.items || [];
  var rowH = Math.round(W * 0.08);
  var padY = Math.round(W * 0.05);
  var cardX = margin; var cardW = W - margin * 2;
  var cardY = Math.round(H * 0.26);
  var cardH = padY * 2 + Math.max(items.length, 1) * rowH;
  roundRect(ctx, cardX, cardY, cardW, cardH, Math.round(W * 0.02));
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = s.sub2; ctx.lineWidth = 1.5; ctx.stroke();
  if (items.length === 0) {
    ctx.fillStyle = s.sub2; ctx.font = Math.round(W * 0.038) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无备忘，点击下方添加', W / 2, cardY + cardH / 2);
  } else {
    var box = Math.round(W * 0.045);
    var textX = cardX + Math.round(W * 0.05) + box + Math.round(W * 0.03);
    var maxW = cardX + cardW - Math.round(W * 0.05) - textX;
    items.forEach(function (it, i) {
      var cy = cardY + padY + i * rowH;
      var bx = cardX + Math.round(W * 0.05);
      // 勾选框
      roundRect(ctx, bx, cy - box / 2, box, box, Math.round(box * 0.25));
      if (it.done) {
        ctx.fillStyle = s.accent; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bx + box * 0.22, cy); ctx.lineTo(bx + box * 0.44, cy + box * 0.2);
        ctx.lineTo(bx + box * 0.8, cy - box * 0.24);
        ctx.stroke();
      } else {
        ctx.strokeStyle = s.sub2; ctx.lineWidth = 1.5; ctx.stroke();
      }
      // 文本（超长截断）
      ctx.fillStyle = it.done ? s.sub2 : s.text;
      ctx.font = Math.round(W * 0.042) + 'px sans-serif';
      ctx.textAlign = 'left';
      var txt = it.text;
      if (ctx.measureText(txt).width > maxW) {
        while (txt.length > 1 && ctx.measureText(txt + '…').width > maxW) txt = txt.slice(0, -1);
        txt += '…';
      }
      ctx.fillText(txt, textX, cy);
      // 完成态删除线
      if (it.done) {
        var tw = ctx.measureText(txt).width;
        ctx.strokeStyle = s.sub2; ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(textX, cy); ctx.lineTo(textX + tw, cy); ctx.stroke();
      }
      // 条目分割线
      if (i < items.length - 1) {
        ctx.strokeStyle = s.sub2; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.moveTo(cardX + Math.round(W * 0.05), cy + rowH / 2);
        ctx.lineTo(cardX + cardW - Math.round(W * 0.05), cy + rowH / 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });
  }
  // 底部统计 + 装饰线
  ctx.fillStyle = s.sub2; ctx.textAlign = 'center';
  ctx.font = Math.round(W * 0.028) + 'px sans-serif';
  ctx.fillText('共 ' + items.length + ' 条 · 完成 ' + data.doneCount + ' 条', W / 2, Math.round(H * 0.88));
  ctx.strokeStyle = s.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - Math.round(W * 0.06), Math.round(H * 0.94));
  ctx.lineTo(W / 2 + Math.round(W * 0.06), Math.round(H * 0.94));
  ctx.stroke();
}

// ===== 页面交互 =====
var CW = 400, CH = 600;
var canvas = document.getElementById('memo');
var scale = 2;
canvas.width = CW * scale; canvas.height = CH * scale;
canvas.style.width = '300px'; canvas.style.height = '450px';
var ctx = canvas.getContext('2d');
ctx.scale(scale, scale);

var items = [];
var schemeIdx = 0;
var viewMode = 'design';
var textEl = document.getElementById('text');

var swBox = document.getElementById('schemes');
SCHEMES.forEach(function (s, i) {
  var d = document.createElement('div');
  d.className = 'sw' + (i === 0 ? ' active' : '');
  d.style.background = s.accent;
  d.title = s.name;
  d.onclick = function () { schemeIdx = i; syncSw(); draw(); };
  swBox.appendChild(d);
});
function syncSw() {
  var els = swBox.children;
  for (var i = 0; i < els.length; i++) els[i].className = 'sw' + (i === schemeIdx ? ' active' : '');
}

function draw() {
  var dta = buildData(items);
  render(ctx, CW, CH, dta, SCHEMES[schemeIdx]);
  if (viewMode === 'epd') EPDSim.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'e6') E6Pro.applyTo(ctx, canvas, CW, CH);
  else if (viewMode === 'layer') {
    var rec = E6Pro.makeRecorder(CW, CH);
    render(rec, CW, CH, dta, SCHEMES[schemeIdx]);
    rec.finish(canvas, E6Pro.DEFAULTS);
  }
}

function addItem() {
  var t = textEl.value.trim();
  if (!t) return;
  if (items.length >= MAX_ITEMS) { alert('最多 ' + MAX_ITEMS + ' 条'); return; }
  items.push({ text: t, done: false });
  textEl.value = '';
  draw();
}
function loadDemo() {
  items = [
    { text: '去超市买牛奶和鸡蛋', done: false },
    { text: '晚上 8 点健身', done: false },
    { text: '给妈妈打电话', done: true },
    { text: '下周二的会议材料', done: false }
  ];
  draw();
}
function clearAll() { items = []; draw(); }

// 点击画布切换条目完成态
canvas.addEventListener('click', function (e) {
  var rect = canvas.getBoundingClientRect();
  var lx = (e.clientX - rect.left) / rect.width * CW;
  var ly = (e.clientY - rect.top) / rect.height * CH;
  var margin = Math.round(CW * 0.07);
  var rowH = Math.round(CW * 0.08);
  var padY = Math.round(CW * 0.05);
  var cardX = margin, cardW = CW - margin * 2;
  var cardY = Math.round(CH * 0.26);
  var cardH = padY * 2 + Math.max(items.length, 1) * rowH;
  if (items.length > 0 && lx >= cardX && lx <= cardX + cardW && ly >= cardY && ly <= cardY + cardH) {
    var idx = Math.floor((ly - cardY - padY) / rowH);
    if (idx >= 0 && idx < items.length) {
      items[idx].done = !items[idx].done;
      draw();
    }
  }
});

function toggleEPD() {
  var order = ['design', 'epd', 'e6', 'layer'];
  viewMode = order[(order.indexOf(viewMode) + 1) % order.length];
  var b = document.getElementById('epdBtn');
  b.textContent = viewMode === 'design' ? '👁 EPD 效果' : (viewMode === 'epd' ? '✨ E6Pro 效果' : (viewMode === 'e6' ? '🧩 分层渲染' : '🎨 设计原色'));
  b.classList.toggle('primary', viewMode !== 'design');
  draw();
}
function toggleStrategy() {
  var cur = E6Pro.DEFAULTS.gradStrategy === 'adaptive' ? 'v3' : 'adaptive';
  E6Pro.DEFAULTS.gradStrategy = cur;
  E6Pro.DEFAULTS.imgStrategy = cur;
  document.getElementById('stratBtn').textContent = '🖌 层:' + (cur === 'adaptive' ? '自适应' : 'v3');
  if (viewMode === 'layer') draw();
}
textEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem(); });
loadDemo();
</script>
</body>
</html>
