name: FrameFilm classic firmware

on:
  push:
    branches: [main]
    tags: ['frame-film-v*']
    paths:
      - 'firmware/frame_film/**'
      - '.github/workflows/frame-film-builds.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/frame_film/**'
      - '.github/workflows/frame-film-builds.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: '正式发布版本（如 2026.11.07.1）；留空只构建'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: frame-film-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pro:
    name: Pro ${{ matrix.variant.name }} ${{ matrix.screen.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: n4r2
            slug: n4r2
            sdkconfig: sdkconfig_pro
          - name: n16r8
            slug: n16r8
            sdkconfig: sdkconfig_pro_n16r8
        screen:
          - name: E6 3.68 792x528
            slug: e6-3.68-792x528
            macro: EPD_SELECT_E6_3_68_792_528
          - name: E6 3.70 720x480
            slug: e6-3.70-720x480
            macro: EPD_SELECT_E6_3_70_720_480
          - name: E6 3.60 600x400
            slug: e6-3.60-600x400
            macro: EPD_SELECT_E6_3_60_600_400
          - name: E6 3.64 760x568
            slug: e6-3.64-760x568
            macro: EPD_SELECT_E6_3_64_760_568
          - name: E6 3.98 768x552
            slug: e6-3.98-768x552
            macro: EPD_SELECT_E6_3_98_768_552
          - name: E4 3.98 768x552
            slug: e4-3.98-768x552
            macro: EPD_SELECT_E4_3_98_768_552
    defaults:
      run:
        shell: bash
        working-directory: firmware/frame_film
    steps:
      - uses: actions/checkout@v6
      - name: Select Pro screen
        env:
          SCREEN_MACRO: ${{ matrix.screen.macro }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          macro = os.environ['SCREEN_MACRO']
          path = pathlib.Path('components/film_hal/inc/hal_epd.h')
          text = path.read_text(encoding='utf-8')
          start = text.index('#if FRAMEFILM_PRO == 1')
          end = text.index('#endif', start)
          block = text[start:end]
          pattern = r'^#define[ \t]+(EPD_SELECT_\w+)[ \t]+[0-9]+[ \t]*$'

          names = re.findall(pattern, block, re.M)
          if macro not in names:
              sys.exit(f'{macro} is not defined in the FRAMEFILM_PRO block')

          block = re.sub(
              pattern,
              lambda match: f'#define {match.group(1)} {1 if match.group(1) == macro else 0}',
              block,
              flags=re.M,
          )
          updated = text[:start] + block + text[end:]
          if updated.count('\n') != text.count('\n'):
              sys.exit('screen selection changed the line count; refusing to write')
          path.write_text(updated, encoding='utf-8')

          selected = [name for name, value in re.findall(r'^#define[ \t]+(EPD_SELECT_\w+)[ \t]+([0-9]+)[ \t]*$', block, re.M) if value == '1']
          if selected != [macro]:
              sys.exit(f'screen selection failed: {selected}')
          print(f'Selected {macro}')
          PY
      - name: Build Pro firmware
        env:
          SCREEN_SLUG: ${{ matrix.screen.slug }}
          VARIANT_SLUG: ${{ matrix.variant.slug }}
          SDKCONFIG_FILE: ${{ matrix.variant.sdkconfig }}
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          mkdir -p ci-logs
          idf.py --version 2>&1 | tee ci-logs/idf-version.log
          idf.py -B build -D "SDKCONFIG=$PWD/$SDKCONFIG_FILE" -D FRAMEFILM_MODEL=pro build 2>&1 | tee ci-logs/build.log
          idf.py -B build size 2>&1 | tee ci-logs/size.log
          idf.py -B build merge-bin -o "frame_film_pro_${VARIANT_SLUG}_${SCREEN_SLUG}-flash.bin" 2>&1 | tee ci-logs/merge.log
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: frame-film-pro-${{ matrix.variant.slug }}-${{ matrix.screen.slug }}
          if-no-files-found: error
          path: |
            firmware/frame_film/build/frame_film.bin
            firmware/frame_film/build/frame_film_pro_${{ matrix.variant.slug }}_${{ matrix.screen.slug }}-flash.bin
            firmware/frame_film/build/frame_film.elf
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frame-film-pro-${{ matrix.variant.slug }}-${{ matrix.screen.slug }}-logs
          if-no-files-found: ignore
          path: |
            firmware/frame_film/ci-logs/
            firmware/frame_film/build/log/

  release:
    name: Publish FrameFilm Pro release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/frame-film-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main')
    needs: pro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Pro build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: frame-film-pro-*
          path: release-input
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'push' ]; then
            version="${REF_NAME#frame-film-v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=frame-film-v$version" >> "$GITHUB_OUTPUT"
      - name: Check classic firmware manifest contracts
        run: python3 -m unittest discover -s tools/ci -p test_classic_firmware_manifest.py -v
      - name: Generate release assets and manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/ci/classic_firmware_manifest.py \
            --input release-input --output release-firmware \
            --version "$VERSION" --model pro
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "FrameFilm Pro 经典固件 · $VERSION"
            echo
            echo "Source commit: $(git rev-parse HEAD)"
            echo
            echo "串口整片烧录：按硬件规格与屏幕选择对应的 \`*-flash.bin\`，从 0x0 写入。"
            echo "BLE OTA：使用对应的 \`*-ota.bin\` 应用镜像。"
            echo
            echo "<!-- framefilm-classic-firmware:v1"
            cat release-firmware/framefilm-classic-firmware.json
            echo "-->"
          } > release-notes.md
      - name: Publish FrameFilm Pro release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-firmware/*.bin release-firmware/*.json)
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "::error::Missing $asset"; exit 1; }
          done
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")
          case "$status" in
            200)
              gh release upload "$TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
              gh release edit "$TAG" --repo "$GH_REPO" \
                --title "FrameFilm Pro $VERSION" --notes-file release-notes.md
              ;;
            404)
              if [ "$EVENT" = 'push' ]; then
                gh release create "$TAG" "${assets[@]}" --repo "$GH_REPO" \
                  --title "FrameFilm Pro $VERSION" --notes-file release-notes.md --latest=false
              else
                gh release create "$TAG" "${assets[@]}" --repo "$GH_REPO" \
                  --target "$GITHUB_SHA" \
                  --title "FrameFilm Pro $VERSION" --notes-file release-notes.md --latest=false
              fi
              ;;
            *)
              echo "::error::GitHub release lookup failed: HTTP $status"
              exit 1
              ;;
          esac
