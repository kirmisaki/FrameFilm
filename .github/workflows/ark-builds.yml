name: Ark builds
on:
  push:
    branches: [main]
    paths: ['flutter_app/**', 'android/app/src/main/java/**', 'firmware/frame_film_ark/**', '.github/workflows/ark-builds.yml', 'docs/ARK_CHANGELOG.md']
  pull_request:
    branches: [main]
    paths: ['flutter_app/**', 'android/app/src/main/java/**', 'firmware/frame_film_ark/**', '.github/workflows/ark-builds.yml', 'docs/ARK_CHANGELOG.md']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Retry the latest concrete Ark changelog release (main only)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ark-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan Ark release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.entry.outputs.tag }}
      title: ${{ steps.details.outputs.title }}
      version_name: ${{ steps.details.outputs.versionName }}
      version_code: ${{ steps.details.outputs.versionCode }}
      source_ref: ${{ steps.tag.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read new Ark changelog entry
        id: entry
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/previous-ark-changelog.md"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE_SHA" ]; then
            git show "${BEFORE_SHA}:docs/ARK_CHANGELOG.md" > "$RUNNER_TEMP/previous-ark-changelog.md" 2>/dev/null || true
          fi
          candidate_args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            candidate_args=('' --candidate)
          fi
          node flutter_app/tool/ark_release_plan.cjs docs/ARK_CHANGELOG.md \
            "$RUNNER_TEMP/previous-ark-changelog.md" flutter_app/pubspec.yaml \
            "$GITHUB_EVENT_NAME" "${candidate_args[@]}"
      - name: Fix release source and check existing release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.entry.outputs.tag }}
          PLANNED: ${{ steps.entry.outputs.publish }}
          REQUESTED: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$PLANNED" != true ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED" != true ]; }; then
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            exit 0
          fi
          release_status="$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/ark-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")"
          case "$release_status" in
            200)
              complete=true
              for asset in frame_film_ark.bin framefilm-ark-flutter.apk framefilm-ark-flutter.json; do
                if ! jq -e --arg name "$asset" \
                  'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
                  "$RUNNER_TEMP/ark-release.json" >/dev/null; then
                  complete=false
                fi
              done
              if [ "$complete" = true ]; then
                echo "Release $TAG already has all Ark assets; build remains CI-only."
                exit 0
              fi
              echo "Release $TAG is incomplete; restoring assets."
              ;;
            404) ;;
            *) echo "::error::GitHub release lookup failed: HTTP $release_status"; exit 1 ;;
          esac
          existing="$(git ls-remote --tags --refs origin "refs/tags/$TAG" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG belongs to another commit; push remains CI-only."
              exit 0
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              GITHUB_OUTPUT='' node flutter_app/tool/ark_release_plan.cjs docs/ARK_CHANGELOG.md \
                /dev/null flutter_app/pubspec.yaml workflow_dispatch
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
      - name: Read release details from fixed tag
        id: details
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.entry.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git show "$TAG:docs/ARK_CHANGELOG.md" > "$RUNNER_TEMP/tag-ark-changelog.md"
          git show "$TAG:flutter_app/pubspec.yaml" > "$RUNNER_TEMP/tag-pubspec.yaml"
          node flutter_app/tool/ark_release_plan.cjs "$RUNNER_TEMP/tag-ark-changelog.md" \
            /dev/null "$RUNNER_TEMP/tag-pubspec.yaml" workflow_dispatch

  android:
    name: Flutter Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore ignored Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=ci_wrapper "$RUNNER_TEMP/ci_wrapper"
          cp "$RUNNER_TEMP/ci_wrapper/android/gradlew" flutter_app/android/gradlew
          cp "$RUNNER_TEMP/ci_wrapper/android/gradlew.bat" flutter_app/android/gradlew.bat
          cp "$RUNNER_TEMP/ci_wrapper/android/gradle/wrapper/gradle-wrapper.jar" flutter_app/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x flutter_app/android/gradlew
      - name: Check distribution signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are unavailable; building a debug APK for CI validation only."
          fi
      - name: Require signing for a release
        if: needs.plan.outputs.publish == 'true' && steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          echo "::error::Release ${{ needs.plan.outputs.tag }} needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Release builds never fall back to debug signing."
          exit 1
      - name: Restore distribution signing
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ark-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ark-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../ci-logs
          flutter --version 2>&1 | tee ../ci-logs/flutter-version.log
          flutter pub get 2>&1 | tee ../ci-logs/flutter-pub.log
          if [ "$SIGNED" = 'true' ]; then
            flutter build apk --release 2>&1 | tee ../ci-logs/flutter-build.log
          else
            flutter build apk --debug 2>&1 | tee ../ci-logs/flutter-build.log
          fi
      - name: Check release runtime assets
        if: steps.signing.outputs.signed == 'true'
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('flutter_app/build/app/outputs/flutter-apk/app-release.apk') as archive:
              names = archive.namelist()
              assert any(name.endswith('/libapp.so') for name in names), 'Missing AOT application'
              assert any(name.endswith('/libflutter.so') for name in names), 'Missing Flutter engine'
              assert 'assets/flutter_assets/kernel_blob.bin' not in names, 'Unexpected debug Dart kernel'
              print('Release AOT application and Flutter engine are present.')
      - name: Check debug runtime assets
        if: steps.signing.outputs.signed != 'true'
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('flutter_app/build/app/outputs/flutter-apk/app-debug.apk') as archive:
              names = archive.namelist()
              assert any(name.endswith('/libflutter.so') for name in names), 'Missing Flutter engine'
              assert 'assets/flutter_assets/kernel_blob.bin' in names, 'Missing debug Dart kernel'
              print('Debug Flutter engine and Dart kernel are present.')
      - name: Prepare app release metadata
        if: steps.signing.outputs.signed == 'true'
        run: node flutter_app/tool/generate_app_release.cjs flutter_app/build/app/outputs/flutter-apk/app-release.apk app-release
      - name: Upload release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ark-flutter-release-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            app-release/framefilm-ark-flutter.apk
            app-release/framefilm-ark-flutter.json
          if-no-files-found: error
      - name: Upload debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ark-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ark-flutter-build-logs
          path: ci-logs/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ark-release.jks" flutter_app/android/key.properties
  firmware:
    name: Ark ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    container: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
        working-directory: firmware/frame_film_ark
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - name: Build Ark and size report
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          mkdir -p ci-logs
          idf.py --version 2>&1 | tee ci-logs/idf-version.log
          idf.py build 2>&1 | tee ci-logs/build.log
          idf.py size 2>&1 | tee ci-logs/size.log
          idf.py merge-bin -o frame_film_ark-flash.bin 2>&1 | tee ci-logs/merge.log
      - name: Upload Ark OTA image
        uses: actions/upload-artifact@v7
        with:
          name: ark-firmware-ota
          if-no-files-found: error
          path: firmware/frame_film_ark/build/frame_film_ark.bin
      - name: Upload Ark serial flash and debug files
        uses: actions/upload-artifact@v7
        with:
          name: ark-firmware-debug
          if-no-files-found: error
          path: |
            firmware/frame_film_ark/build/frame_film_ark-flash.bin
            firmware/frame_film_ark/build/bootloader/bootloader.bin
            firmware/frame_film_ark/build/partition_table/partition-table.bin
            firmware/frame_film_ark/build/ota_data_initial.bin
            firmware/frame_film_ark/build/flasher_args.json
            firmware/frame_film_ark/build/flash_args
            firmware/frame_film_ark/build/frame_film_ark.elf
            firmware/frame_film_ark/build/frame_film_ark.map
            firmware/frame_film_ark/sdkconfig
      - name: Upload Ark build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ark-firmware-build-logs
          if-no-files-found: ignore
          path: |
            firmware/frame_film_ark/ci-logs/
            firmware/frame_film_ark/build/log/

  release:
    name: Publish Ark firmware and app
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, firmware, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - name: Download this run's firmware
        uses: actions/download-artifact@v8
        with:
          name: ark-firmware-ota
          path: release-input
      - name: Download this run's app
        uses: actions/download-artifact@v8
        with:
          name: ark-flutter-release-apk
          path: app-release-input
      - name: Publish Ark release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TITLE: ${{ needs.plan.outputs.title }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          image="$(find release-input -type f -name frame_film_ark.bin -print -quit)"
          apk="$(find app-release-input -type f -name framefilm-ark-flutter.apk -print -quit)"
          metadata="$(find app-release-input -type f -name framefilm-ark-flutter.json -print -quit)"
          test -s "$image" && test -s "$apk" && test -s "$metadata"
          node -e 'const m=require("./"+process.argv[1]); if(m.versionName!==process.env.VERSION_NAME || String(m.versionCode)!==process.env.VERSION_CODE) process.exit(1)' "$metadata"
          node flutter_app/tool/ark_release_plan.cjs docs/ARK_CHANGELOG.md \
            /dev/null flutter_app/pubspec.yaml workflow_dispatch release-notes.md
          digest="$(sha256sum "$image" | cut -d ' ' -f 1)"
          cat >> release-notes.md <<EOF

          Source commit: $(git rev-parse HEAD)
          OTA image SHA256: ${digest}

          frame_film_ark.bin is the OTA application image, not a merged serial-flash image.
          The app checks framefilm-ark-flutter.json for versionCode; firmware updates use the ELF build fingerprint.
          EOF
          release_status="$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/ark-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG")"
          case "$release_status" in
            200)
              gh release upload "$TAG" "$image" "$apk" "$metadata" --repo "$GH_REPO" --clobber
              gh release edit "$TAG" --repo "$GH_REPO" --title "$RELEASE_TITLE" --notes-file release-notes.md
              ;;
            404)
              gh release create "$TAG" "$image" "$apk" "$metadata" --repo "$GH_REPO" \
                --verify-tag --title "$RELEASE_TITLE" \
                --notes-file release-notes.md --latest=false
              ;;
            *) echo "::error::GitHub release lookup failed: HTTP $release_status"; exit 1 ;;
          esac
